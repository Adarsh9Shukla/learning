apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport-svc
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80 # Port exposed by the service inside the cluster
      targetPort: 80 # Port the Nginx container is listening on
      nodePort: 32080 # External port on the Nodes (must be between 30000-32767)
# expose Nginx outside the cluster via a specific port on your cluster nodes
