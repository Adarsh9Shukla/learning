apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: production # <-- Deploys into the production namespace
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80
