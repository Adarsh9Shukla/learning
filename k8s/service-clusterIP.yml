apiVersion: v1
kind: Service
metadata:
  name: nginx-clusterip-svc
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80 # Port exposed by the service inside the cluster
      targetPort: 80 # Port the Nginx container is listening on
# for internal cluster communication (e.g., if a backend application inside the cluster needs to talk to Nginx).
